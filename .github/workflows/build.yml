name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code download karo
        uses: actions/checkout@v4

      - name: Flutter setup karo
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Dependencies lao
        run: flutter pub get

      - name: App icon generate karo
        run: dart run flutter_launcher_icons

      - name: APK banao (arm64 only - smaller)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: APK verify karo
        run: |
          ls -lh build/app/outputs/flutter-apk/
          file build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          unzip -t build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | tail -5

      - name: APK save karo
        uses: actions/upload-artifact@v4
        with:
          name: ludo-genji-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          compression-level: 0
